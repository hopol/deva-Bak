# PR 与推到 main 时做类型检查 + 构建，挡住编不过的改动。打包与发版仍由 release.yml 负责。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一 PR 连续推送时取消上一次未跑完的检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 只做类型检查和 electron-vite 构建，用不到 Electron 二进制，跳过下载以加快安装
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build
